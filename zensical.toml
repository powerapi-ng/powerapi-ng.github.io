[project]
site_name = "PowerAPI"
site_description =  "PowerAPI"
site_url = "https://powerapi.org/"
repo_url = "https://github.com/powerapi-ng/powerapi"
copyright = "Copyright &copy; 2026 <a href=\"https://inria.fr\">Inria</a> and the <a href=\"https://www.univ-lille.fr\">University of Lille</a>.</br>The content of the <a href=\"https://powerapi.org\">powerapi.org</a> website is licensed under a <a href=\"https://creativecommons.org/licenses/by/4.0/\">Creative Commons Attribution 4.0 International License</a>.</br>Logos of sponsors displayed on this website are protected under trademark law and remain the property of their respective owners."

nav = [
  {"Home" = "index.md"},
  {"Getting Started" = "getting_started.md"},
  {"Reference" = [
        {"Overview" = "reference/overview.md"},
        {"Sensors" = [
            {"HWPC Sensor" = "reference/sensors/hwpc-sensor.md"}]},
        {"Formulas" = [
            {"SmartWatts" = "reference/formulas/smartwatts.md"}]},
        {"Processors" = [
          {"Description" = "reference/processors/processors.md"}]},
        {"Reports" = [
          {"Description" = "reference/reports/reports.md"}]},
        {"Grafana" = [
          {"Description" = "reference/grafana/grafana.md"}]}
    ]
  },
  {"Contributing" = "contributing.md"},
  {"Citing and Publications" = "publications.md"},
  {"About Us" = "about.md"},
  {"Credits and Licence" = "credits_licence.md"}
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

[project.markdown_extensions.pymdownx.betterem]

[project.markdown_extensions.pymdownx.caret]

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.critic]

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.tables]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.admonition]

[project.theme]
# Used theme
name = "material"

# favicon to show on the browser
favicon = "images/favicon.ico"

  # Logo used in the header
logo = "assets/images/PowerAPI-logo.png"

# Overrides files
custom_dir = "overrides"

features = [
    # - navigation.instant
    "navigation.tabs",
    "navigation.path",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "navigation.sections",
    "content.code.copy",
    "search.highlight"
]

search = true

#palette.primary =  "red"
#palette.accent = "green"

[[project.theme.palette]]

scheme = "primary"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"
primary =  "red"
accent = "green"



[[project.theme.palette]]
# Palette toggle for dark mode
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"
primary = "red"
accent = "green"

[project.theme.icon]
repo = "fontawesome/brands/github"




[project.extra]
  version.provider = "mike"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/powerapi-ng/powerapi"

[[project.extra.social]]
icon = "fontawesome/solid/paper-plane"
link = "mailto:powerapi-staff@inria.fr"
